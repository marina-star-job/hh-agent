name: HH Diag

# Ручная диагностика: несколько одиночных запросов к api.hh.ru в разных
# режимах (с токеном / без, разные User-Agent), чтобы понять, где hh требует
# капчу. Результат пишется в аннотации запуска (::notice::), тело ответов и
# токен не выводятся. Нагрузка — ~6 запросов с паузами.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install requests
      - name: Probe hh API
        env:
          HH_ACCESS_TOKEN: ${{ secrets.HH_ACCESS_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, time, json, requests
          TOKEN = os.environ["HH_ACCESS_TOKEN"]
          BASE = "https://api.hh.ru"
          APP_UA = "hh-agent/1.0 (marina-star-job)"
          SEARCH = {"text": "руководитель отдела продаж", "area": 1, "period": 2, "per_page": 20}

          import random, string, uuid
          def android_headers():
              # Как в hh-applicant-tool 2.x (api/client.py + utils/user_agent.py)
              model = "".join(random.choice(string.ascii_uppercase + string.digits) for _ in range(10))
              ua = (f"ru.hh.android/7.{random.randint(100,150)}.{random.randint(10000,15000)}, "
                    f"Device: {model}, Android OS: {random.randint(11,15)} (UUID: {uuid.uuid4()})")
              return {"Accept": "application/json", "X-Force-App-Access": "true",
                      "X-HH-App-Active": "true", "User-Agent": ua}
          ANDROID = android_headers()

          def probe(label, path, params=None, token=False, ua=None, android=False):
              h = dict(ANDROID) if android else {}
              if token:
                  h["Authorization"] = f"Bearer {TOKEN}"
              if ua:
                  h["User-Agent"] = ua
                  h["HH-User-Agent"] = ua
              try:
                  r = requests.get(BASE + path, params=params, headers=h, timeout=30)
                  body = r.text
                  captcha = "captcha_required" in body
                  err = ""
                  try:
                      j = r.json()
                      errs = j.get("errors") or []
                      if errs:
                          err = ",".join(f"{e.get('type')}/{e.get('value')}" for e in errs)
                      items = len(j.get("items", [])) if isinstance(j, dict) else 0
                  except ValueError:
                      j, items = {}, 0
                  msg = f"{label}: HTTP {r.status_code} | captcha={captcha} | items={items} | errors={err or '-'}"
              except Exception as e:
                  msg, j = f"{label}: EXCEPTION {type(e).__name__}: {e}", {}
              print(f"::notice::{msg}")
              time.sleep(4)
              return j

          # Раунд 2: заголовки Android-приложения (как hh-applicant-tool).
          s1 = probe("A search [token, android headers]", "/vacancies", SEARCH, token=True, android=True)
          items = s1.get("items") or []
          if items:
              it = items[0]
              fields = sorted(k for k in it.keys())
              print(f"::notice::A list-item fields: {','.join(fields)}")
              print(f"::notice::A list-item sample: schedule={(it.get('schedule') or {}).get('id')} "
                    f"work_format={[w.get('id') for w in (it.get('work_format') or [])]} "
                    f"response_letter_required={it.get('response_letter_required')} has_test={it.get('has_test')}")
              for n, v in enumerate(items[:3], 1):
                  probe(f"B{n} detail [token, android headers]", f"/vacancies/{v['id']}", token=True, android=True)
              probe("C detail [token, default UA] (как сейчас в агенте)", f"/vacancies/{items[0]['id']}", token=True)
          else:
              print("::notice::A: поиск не вернул вакансий — detail-пробы пропущены")
          EOF
